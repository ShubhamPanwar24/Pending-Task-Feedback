<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SA Owner Pending Feedback - GitHub</title>
<style>
:root{--blue:#0969da;--green:#1a7f37;--red:#cf222e;--bg:#f6f8fa;--card:#fff;--line:#d0d7de;--text:#24292f;--muted:#57606a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Segoe UI,Arial,sans-serif;color:var(--text)}
.head{background:#0969da;color:white;text-align:center;padding:22px}.head h1{margin:0;font-size:24px}.head p{margin:8px 0 0;opacity:.95}.wrap{max-width:1120px;margin:18px auto;padding:0 14px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 4px 14px rgba(27,31,36,.05)}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}label{display:block;font-weight:700;margin-bottom:7px}select,input,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;font:inherit;background:white}textarea{min-height:74px;resize:vertical}.btn{border:0;border-radius:10px;background:var(--blue);color:white;padding:12px 16px;font-weight:800;cursor:pointer}.btn.green{background:var(--green)}.btn.grey{background:#eaeef2;color:#24292f}.hidden{display:none!important}.muted{color:var(--muted);font-size:13px}.msg{padding:12px;border-radius:10px;background:#ddf4ff;color:#0969da;font-weight:700;margin-top:10px}.msg.err{background:#ffebe9;color:#cf222e}.msg.ok{background:#dafbe1;color:#1a7f37}.task{border:1px solid var(--line);border-radius:14px;background:white;padding:14px;margin:12px 0}.taskHead{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:12px;flex-wrap:wrap}.tag{background:#ddf4ff;color:#0969da;border-radius:999px;padding:6px 10px;font-weight:800;font-size:12px}.field{background:#f6f8fa;border:1px solid #d8dee4;border-radius:10px;padding:9px}.field small{display:block;color:var(--muted);font-size:11px}.field span{font-weight:800}.summary{display:flex;gap:10px;flex-wrap:wrap}.box{background:#f6f8fa;border:1px solid var(--line);border-radius:12px;padding:11px;min-width:130px}.box b{font-size:24px;display:block}.bar{position:sticky;bottom:0;background:rgba(246,248,250,.96);border-top:1px solid var(--line);padding:12px;display:flex;justify-content:center;gap:10px}.title{font-size:18px;font-weight:900;margin:0 0 10px}.ok{color:var(--green);font-weight:900}.bad{color:var(--red);font-weight:900}@media(max-width:850px){.row,.grid{grid-template-columns:1fr}.bar{display:block}.bar .btn{width:100%;margin:5px 0}.head h1{font-size:21px}}
</style>
</head>
<body>
<div class="head"><h1>SA Owner Pending Feedback</h1><p>GitHub-only version: data loads from pending_tasks.json and submits through GitHub Issues.</p></div>
<div class="wrap">
  <div class="card">
    <p class="title">Load Pending Tasks</p>
    <button class="btn" id="loadBtn">Refresh Pending Tasks</button>
    <p class="muted">Admin updates <b>pending_tasks.json</b> daily in GitHub. SA Owners only open this GitHub Pages link.</p>
    <div id="loadMsg" class="msg hidden"></div>
  </div>
  <div class="card hidden" id="ownerCard">
    <div class="row">
      <div><label>Select SA Owner</label><select id="owner"><option value="">Select your name</option></select></div>
      <div><label>Search</label><input id="search" placeholder="Cluster / HHID / PMAID / WO / Appointment" /></div>
    </div>
  </div>
  <div class="card hidden" id="summary">
    <p class="title" id="ownerTitle">Pending Tasks</p>
    <div class="summary"><div class="box"><small>Total</small><b id="total">0</b></div><div class="box"><small>Filled</small><b id="filled">0</b></div><div class="box"><small>Remaining</small><b id="remain">0</b></div></div>
  </div>
  <div id="tasks"></div>
</div>
<div class="bar hidden" id="bar"><button class="btn grey" id="draftBtn">Save Draft</button><button class="btn green" id="submitBtn">Submit Feedback to GitHub</button></div>
<script>
let tasks=[], owner='', draft=JSON.parse(localStorage.getItem('sa_github_draft')||'{}');
const $=id=>document.getElementById(id), norm=v=>String(v??'').trim(), low=v=>norm(v).toLowerCase();
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const key=r=>norm(r['Appointment Number'])||norm(r['Work Order Number'])||norm(r['Cluster ID'])+'|'+norm(r.PMAID);
function repoInfo(){
  // Works for https://OWNER.github.io/REPO/
  const host=location.hostname; const owner=host.endsWith('.github.io')?host.replace('.github.io',''):'';
  const repo=location.pathname.split('/').filter(Boolean)[0] || owner+'.github.io';
  return {owner,repo};
}
function msg(t,cls=''){let e=$('loadMsg');e.textContent=t;e.className='msg '+cls;e.classList.remove('hidden')}
async function loadTasks(){
  try{const res=await fetch('pending_tasks.json?ts='+Date.now()); if(!res.ok) throw new Error('pending_tasks.json not found'); tasks=(await res.json()).filter(x=>(x['Feedback Status']||'Pending')==='Pending'); populateOwners(); msg('Loaded '+tasks.length+' pending tasks.','ok');}
  catch(e){msg('Could not load pending_tasks.json. Admin must upload/update this file in GitHub root. '+e.message,'err')}
}
function populateOwners(){let owners=[...new Set(tasks.map(x=>norm(x['SA Owner'])).filter(Boolean))].sort();$('owner').innerHTML='<option value="">Select your name</option>'+owners.map(o=>`<option>${esc(o)}</option>`).join('');$('ownerCard').classList.toggle('hidden',!owners.length)}
$('loadBtn').onclick=loadTasks; $('owner').onchange=()=>{owner=$('owner').value;render()}; $('search').oninput=render;
function ownerRows(){let q=low($('search').value);return tasks.filter(r=>norm(r['SA Owner'])===owner).filter(r=>!q||['Cluster ID','HHID','PMAID','Work Order Number','Appointment Number'].some(c=>low(r[c]).includes(q)))}
function render(){if(!owner){$('tasks').innerHTML='';$('summary').classList.add('hidden');$('bar').classList.add('hidden');return}let rows=ownerRows();$('summary').classList.remove('hidden');$('bar').classList.remove('hidden');$('ownerTitle').textContent=owner+' - Pending Tasks';$('tasks').innerHTML=rows.map((r,i)=>{let f=draft[key(r)]||{}, ok=norm(f.reason)&&norm(f.date);return `<div class="task" data-key="${esc(key(r))}"><div class="taskHead"><b>Task ${i+1}</b><span class="tag">${esc(r['Task Status']||r.Status||'Pending')}</span></div><div class="grid"><div class="field"><small>Cluster ID</small><span>${esc(r['Cluster ID'])}</span></div><div class="field"><small>HHID</small><span>${esc(r.HHID)}</span></div><div class="field"><small>PMAID</small><span>${esc(r.PMAID)}</span></div><div class="field"><small>Work Order Number</small><span>${esc(r['Work Order Number'])}</span></div><div class="field"><small>Appointment Number</small><span>${esc(r['Appointment Number'])}</span></div><div class="field"><small>Feedback</small><span class="status ${ok?'ok':'bad'}">${ok?'Filled':'Pending'}</span></div></div><div class="row" style="margin-top:12px"><div><label>Reason for Pending</label><textarea class="reason">${esc(f.reason||'')}</textarea></div><div><label>By which Date Connect</label><input type="date" class="date" value="${esc(f.date||'')}"></div></div></div>`}).join('');document.querySelectorAll('.reason,.date').forEach(e=>e.onchange=saveDraft);counts()}
function saveDraft(){document.querySelectorAll('.task').forEach(t=>{let reason=t.querySelector('.reason').value.trim(), date=t.querySelector('.date').value.trim(); if(reason||date)draft[t.dataset.key]={reason,date}; else delete draft[t.dataset.key]; let s=t.querySelector('.status'), ok=reason&&date; s.textContent=ok?'Filled':'Pending'; s.className='status '+(ok?'ok':'bad')}); localStorage.setItem('sa_github_draft',JSON.stringify(draft));counts()}
function counts(){let rows=tasks.filter(r=>norm(r['SA Owner'])===owner),filled=rows.filter(r=>{let f=draft[key(r)]||{};return f.reason&&f.date}).length;$('total').textContent=rows.length;$('filled').textContent=filled;$('remain').textContent=rows.length-filled}
$('draftBtn').onclick=()=>{saveDraft();alert('Draft saved in browser.')};
$('submitBtn').onclick=()=>{saveDraft();let rows=tasks.filter(r=>norm(r['SA Owner'])===owner);let missing=rows.filter(r=>{let f=draft[key(r)]||{};return !(f.reason&&f.date)}); if(missing.length){alert('Fill all tasks before submit. Remaining: '+missing.length);return}let feedbackRows=rows.map(r=>{let f=draft[key(r)]||{};return {'Cluster ID':norm(r['Cluster ID']),'HHID':norm(r.HHID),'PMAID':norm(r.PMAID),'Work Order Number':norm(r['Work Order Number']),'SA Owner':norm(r['SA Owner']),'Appointment Number':norm(r['Appointment Number']),'Reason for Pending':f.reason,'By which Date Connect':f.date,'Submitted Time':new Date().toISOString()}});let payload=JSON.stringify({saOwner:owner,rows:feedbackRows},null,2);let {owner:ghOwner,repo}=repoInfo(); if(!ghOwner||!repo){alert('Cannot detect GitHub repo. Open this from GitHub Pages.');return}let title='[SA-FEEDBACK] '+owner+' '+new Date().toISOString().slice(0,10);let body='Feedback submitted from GitHub Pages.\n\n```json\n'+payload+'\n```';let url=`https://github.com/${ghOwner}/${repo}/issues/new?title=${encodeURIComponent(title)}&body=${encodeURIComponent(body)}`;window.open(url,'_blank');alert('GitHub issue page opened. Please click Submit new issue there. GitHub Action will save feedback.csv automatically.');}
loadTasks();
</script>
</body>
</html>
